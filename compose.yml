version: '3.8' # Version de la spécification Compose

services:
  # ----------------------------------------------------
  # SERVICE 1: Base de Données (MariaDB)
  # ----------------------------------------------------
  db:
    image: docker.io/library/mariadb:10.6
    container_name: lahar-db
    restart: always
    environment:
      # Les valeurs sont chargées depuis le fichier .env
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - wordpress-net

  # ----------------------------------------------------
  # SERVICE 2: Application WordPress
  # ----------------------------------------------------
  wordpress:
    image: docker.io/library/wordpress:latest 
    container_name: lahar-app
    depends_on: 
      - db
    restart: always 
    ports: 
      - "8080:80" # Mapping du port (http://localhost:8080)
    
    # Conservation du correctif de permission pour le Bind Mount
    user: "0" 

    environment:
      WORDPRESS_DB_HOST: db # Nom du service de la DB
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      # Optionnel : Forcer l'URL si besoin
      # WORDPRESS_CONFIG_EXTRA: |
      #   define('WP_HOME', 'http://localhost:8080');
      #   define('WP_SITEURL', 'http://localhost:8080');
      
    volumes:
      # BIND MOUNT pour le développement (renommé wordpress-code)
      - ./wordpress-code:/var/www/html 
      
    networks:
      - wordpress-net

volumes:
  db-data:

networks:
  wordpress-net:
    driver: bridge